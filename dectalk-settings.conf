# Default DECtalk tweaks for ./dectalk-say.
#
# This file is sourced by a Bash wrapper, so use shell assignment syntax.
# Quote values that contain spaces or DECtalk inline commands.

# Language: us, uk, sp, gr (or de), la, fr.
# Leave blank to use DECtalk.conf's Default_lang, which is currently us.
DECTALK_LANG=""

# Voice can be a number or alias:
#   0 paul/pablo
#   1 betty/berta/beate
#   2 harry/humberto/hans
#   3 frank/francisco
#   4 dennis/domingo/dieter
#   5 kit/kid/juanito/karl
#   6 ursula
#   7 rita
#   8 wendy
DECTALK_VOICE=paul

# DECtalk's real speaking-rate limit is 600. The wrapper clamps anything
# higher to 600 so it does not go silent.
DECTALK_RATE=180

# Main volume: 0-100.
DECTALK_VOLUME=90

# Wave output encoding when using ./dectalk-say --out FILE:
#   1 = PCM, 16-bit mono 11 kHz
#   2 = PCM, 8-bit mono 11 kHz
#   3 = MULAW, 8-bit mono 8 kHz
DECTALK_ENCODING=1

# Clause mode for stdin/file input. Leave 0 for line mode, set 1 for clause mode.
# Deep SPDEFS tuning speaks full stdin/file input instead of classic clause mode.
DECTALK_CLAUSE=0

# Optional raw DECtalk commands/text sent before or after the input.
# Handy examples:
#   DECTALK_PRE="[:nb :ra220]"        # Betty voice + rate 220 via inline DECtalk syntax
#   DECTALK_PRE="[:phoneme on]"       # phoneme mode
#   DECTALK_POST="[:phoneme off]"     # turn phoneme mode back off
DECTALK_PRE=""
DECTALK_POST=""

# Deep voice-shaping. These route ./dectalk-say through ./dectalk-tune.
# Presets: robot, giant, chipmunk, whisper, rough, flat, bright, dark
DECTALK_PRESET=""

# Raw voice parameters, space-separated. Run `./dectalk-say --list-params`.
# Examples:
#   DECTALK_PARAMS="pitch=95 head=140 roughness=60"       # deeper/rougher
#   DECTALK_PARAMS="pitch=260 head=55 quickness=130"      # tiny/high
DECTALK_PARAMS=""

# auto = use ./dectalk-tune only when presets/params/dump options are present.
# always = route everything through ./dectalk-tune.
# never = only use the classic ./say unless command-line deep options force tune.
DECTALK_USE_TUNE=auto

# Uncomment to make every run write audio to a file by default.
# DECTALK_OUT="dectalk.wav"
